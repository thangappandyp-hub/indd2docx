[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indd2docx"
version = "0.1.0"
description = "INDD to editable DOCX through IDML"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1,<2",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
indd2docx = "indd2docx.cli:main"
